<!doctype html><meta charset="utf-8"><title>WebGLRenderer + WebGLNodesHandler: NodeMaterials have zero stereo disparity in WebXR</title>
<style>body{margin:0;background:#000;color:#ddd;font:14px/1.4 monospace}#info{position:fixed;left:8px;top:8px;white-space:pre;background:rgba(0,0,0,.6);padding:6px 8px}</style>
<script type="importmap">{"imports":{
 "three":"https://raw.githack.com/mrdoob/three.js/dev/build/three.module.js",
 "three/webgpu":"https://raw.githack.com/mrdoob/three.js/dev/build/three.webgpu.js",
 "three/tsl":"https://raw.githack.com/mrdoob/three.js/dev/build/three.tsl.js",
 "three/addons/":"https://raw.githack.com/mrdoob/three.js/dev/examples/jsm/"}}</script>
<body><div id="info">loading…</div><script type="module">
// Repro: WebGLRenderer + WebGLNodesHandler (NodeMaterial compatibility layer, r184+). In WebXR, NodeMaterials are rendered
// from the same camera for BOTH eyes (zero disparity) while classic materials get per-eye cameras
// (r186: the union camera; r187+: the user camera, which follows the first sub camera = left eye).
// Cause: WebGLRenderer.render() calls nodesHandler.renderStart(scene, camera) before swapping camera for xr.getCamera(),
// and WebGLNodesHandler.onBeforeRenderCallback ignores the per-eye camera passed to it.
// ?patch=1 applies a one-function workaround (re-point nodeFrame.camera in onBeforeRender).
import * as THREE from 'three';
import { MeshBasicNodeMaterial } from 'three/webgpu';
import { color } from 'three/tsl';
import { WebGLNodesHandler } from 'three/addons/tsl/WebGLNodesHandler.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';

const patch = new URLSearchParams(location.search).get('patch') === '1';
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(innerWidth, innerHeight); renderer.xr.enabled = true; document.body.appendChild(renderer.domElement);
const handler = new WebGLNodesHandler();
renderer.setNodesHandler(handler);
if (patch) {
  const orig = handler.onBeforeRenderCallback;
  handler.onBeforeRenderCallback = function (r, scene, camera, geometry, object) {
    if (camera && camera.isCamera && !camera.isArrayCamera) handler.nodeFrame.camera = camera; // per-eye camera from WebGLRenderer
    return orig.call(this, r, scene, camera, geometry, object);
  };
}
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 100); camera.position.set(0, 1.6, 0);
const geo = new THREE.SphereGeometry(0.3, 32, 16);
const classic = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xff2020 })); classic.position.set(-0.6, 1.6, -2); scene.add(classic); // RED: classic
const nodeMat = new MeshBasicNodeMaterial(); nodeMat.colorNode = color(0x2060ff);
const node = new THREE.Mesh(geo, nodeMat); node.position.set(0.6, 1.6, -2); scene.add(node);                                              // BLUE: NodeMaterial
document.body.appendChild(VRButton.createButton(renderer));
renderer.setAnimationLoop(() => renderer.render(scene, camera));
document.getElementById('info').textContent = [
  'three dev build (raw.githack mrdoob/three.js/dev)  r' + THREE.REVISION,
  'red = MeshBasicMaterial (classic), blue = MeshBasicNodeMaterial via WebGLNodesHandler',
  'expected: both spheres at the same depth in VR. bug: blue has no stereo disparity (flat / at infinity).',
  'patch=' + patch + '  (add ?patch=1 for the workaround)',
  navigator.userAgent,
].join('\n');
window.__repro = { renderer, handler, camera };
window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script></body>
